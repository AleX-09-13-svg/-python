<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-label="Соответствие цветов присадки">
  <rect width="980" height="360" fill="#f7f7f4"/>
  <text x="40" y="48" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#202020">Соответствие цветов граней и присадки</text>
  <text x="40" y="78" font-family="Arial, sans-serif" font-size="15" fill="#5f5f5f">Цвет назначается грани в Inventor, скрипты читают цвет и создают нужные элементы.</text>

  <g transform="translate(40 115)">
    <rect x="0" y="0" width="210" height="170" rx="8" fill="#ffffff" stroke="#d8d8d8"/>
    <rect x="18" y="20" width="52" height="52" rx="6" fill="#d62828"/>
    <text x="86" y="42" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#202020">Красный</text>
    <text x="86" y="66" font-family="Arial, sans-serif" font-size="14" fill="#555555">каркас</text>
    <line x1="18" y1="92" x2="192" y2="92" stroke="#e6e6e6"/>
    <text x="18" y="122" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#202020">Конфирмат 3 шт</text>
    <text x="18" y="148" font-family="Arial, sans-serif" font-size="13" fill="#555555">2 крайние + центр</text>
  </g>

  <g transform="translate(270 115)">
    <rect x="0" y="0" width="210" height="170" rx="8" fill="#ffffff" stroke="#d8d8d8"/>
    <rect x="18" y="20" width="52" height="52" rx="6" fill="#f2c300"/>
    <text x="86" y="42" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#202020">Желтый</text>
    <text x="86" y="66" font-family="Arial, sans-serif" font-size="14" fill="#555555">каркас</text>
    <line x1="18" y1="92" x2="192" y2="92" stroke="#e6e6e6"/>
    <text x="18" y="122" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#202020">Конфирмат 2 шт</text>
    <text x="18" y="148" font-family="Arial, sans-serif" font-size="13" fill="#555555">только крайние точки</text>
  </g>

  <g transform="translate(500 115)">
    <rect x="0" y="0" width="210" height="170" rx="8" fill="#ffffff" stroke="#d8d8d8"/>
    <rect x="18" y="20" width="52" height="52" rx="6" fill="#2f9e44"/>
    <text x="86" y="42" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#202020">Зеленый</text>
    <text x="86" y="66" font-family="Arial, sans-serif" font-size="14" fill="#555555">каркас</text>
    <line x1="18" y1="92" x2="192" y2="92" stroke="#e6e6e6"/>
    <text x="18" y="122" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#202020">Стяжка</text>
    <text x="18" y="148" font-family="Arial, sans-serif" font-size="13" fill="#555555">элементы каркаса</text>
  </g>

  <g transform="translate(730 115)">
    <rect x="0" y="0" width="210" height="170" rx="8" fill="#ffffff" stroke="#d8d8d8"/>
    <rect x="18" y="20" width="52" height="52" rx="6" fill="#1971c2"/>
    <text x="86" y="42" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#202020">Синий</text>
    <text x="86" y="66" font-family="Arial, sans-serif" font-size="14" fill="#555555">ящик</text>
    <line x1="18" y1="92" x2="192" y2="92" stroke="#e6e6e6"/>
    <text x="18" y="122" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#202020">Стяжка</text>
    <text x="18" y="148" font-family="Arial, sans-serif" font-size="13" fill="#555555">элементы ящика</text>
  </g>

  <text x="40" y="326" font-family="Arial, sans-serif" font-size="14" fill="#606060">Порядок: назначить цвета -> создать эскизы -> запустить скрипты присадки.</text>
</svg>
